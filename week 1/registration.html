<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration</title>
  </head>
  <body>
    <h1>User Registration</h1>
    <h2>Personal Details</h2>
    <div>
      <label>First Name:</label>
      <input type="text" />
    </div>
    <div>
      <label>Last Name:</label>
      <input type="text" />
    </div>
    <div>
      <label>Age</label>
      <input type="number" />
    </div>
    <div>
      <label>Gender</label>
      <select>
        <option selected>Male</option>
        <option>Female</option>
        <option>Others</option>
      </select>
    </div>
    <div>
      <label>Profile Picture:</label>
      <button>Browse...</button>
      <label>No files Selected</label>
    </div>
    <h3>Account Details</h3>
    <div>
      <label>Email: </label>
      <input type="email" />
    </div>
    <div>
      <label>Password: </label>
      <input type="password" />
    </div>
    <div>
      <label>Role: </label>
      <input type="radio" />Admin <input type="radio" />User
    </div>
    <div><input type="checkbox" />I agree to the terms and conditions.</div>
    <button>Register</button>
    <button>Reset</button>
    <footer>2026 My Todo list. All rights reserved.</footer>
  </body>
</html>
